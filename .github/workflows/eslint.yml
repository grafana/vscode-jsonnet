name: eslint
on:
  push:
    branches:
      - main
  pull_request: {}

permissions:
  contents: read

jobs:
  eslint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: npm install
      - run: npm run compile
      - run: npm run lint
        