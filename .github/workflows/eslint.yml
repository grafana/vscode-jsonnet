name: eslint
on:
  push:
    branches:
      - main
  pull_request: {}

permissions:
  contents: read

jobs:
  eslint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - run: npm install
      - run: npm run compile
      - run: npm run lint
        